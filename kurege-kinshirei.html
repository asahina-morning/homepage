<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="site-icon.png">
<link rel="apple-touch-icon" href="site-icon.png">
<title>クレゲ禁止令 | あさひな</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
<script type="module" crossorigin src="https://glass.danilofiumi.com/web-comps/boundle.js"></script>
<style>
*{box-sizing:border-box;}
body{
    min-height:100vh;
    margin:0;
    padding:60px 26px;
    background:linear-gradient(180deg,#ae9dd7,#8669b8);
    color:#fff;
    font-family:"Zen Maru Gothic",sans-serif;
    line-height:1.9;
}
.wrapper{max-width:760px;margin:auto;text-align:center;}
h1{margin:0 0 32px;font-size:2.2rem;}
.notice-image{
    display:block;
    width:100%;
    max-width:720px;
    height:auto;
    margin:0 auto 32px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.24);
    box-shadow:0 18px 42px rgba(0,0,0,.24);
}
.glass-button-link{
    display:inline-flex;
    max-width:100%;
    text-decoration:none;
}
.glass-button-link sv-liquid-glass{
    display:block;
    width:fit-content;
    max-width:100%;
    min-height:52px;
}
@media (min-width:961px){
    body{padding:clamp(60px,8vh,96px) clamp(32px,5vw,80px);}
    .wrapper{max-width:900px;}
}
@media (max-width:600px){
    body{padding:32px 16px;}
    h1{margin-bottom:24px;font-size:1.55rem;line-height:1.5;}
    .notice-image{margin-bottom:24px;border-radius:14px;}
    .glass-button-link,
    .glass-button-link sv-liquid-glass{width:100%;}
}
</style>
</head>
<body>
<main class="wrapper">
    <h1>クレゲ禁止令</h1>
    <img class="notice-image" src="ピン留め用.png" alt="クレゲ禁止令の画像">
    <a class="glass-button-link" href="index.html">
        <sv-liquid-glass styles='{"style":{"roundness":60,"padding_x":1.5,"padding_y":0.8},"text":{"content":"戻る","edit":false,"font_family":"Zen Maru Gothic","size_weight":500,"font_size":1},"color":{"accent":"#D7DADD"}}' contrast="light"></sv-liquid-glass>
    </a>
</main>
<script>
customElements.whenDefined("sv-liquid-glass").then(function(){
    const glassButton = document.querySelector("sv-liquid-glass");
    const shadowRoot = glassButton && glassButton.shadowRoot;

    if(!glassButton || !shadowRoot){
        return;
    }

    const applyButtonSize = function(){
        const button = shadowRoot.querySelector("button");
        const text = button && button.querySelector("span");

        if(!button || !text){
            return;
        }

        text.style.setProperty("font-size", "16px", "important");
        text.style.setProperty("letter-spacing", "0", "important");
        text.style.setProperty("padding-inline", "24px", "important");
        text.style.setProperty("padding-block", "13px", "important");
        button.style.setProperty("height", "52px", "important");
        button.style.setProperty("min-height", "52px", "important");
        button.style.setProperty("box-sizing", "border-box", "important");

        if(window.matchMedia("(max-width:600px)").matches){
            button.style.setProperty("width", glassButton.getBoundingClientRect().width + "px", "important");
        }else{
            button.style.removeProperty("width");
        }
    };

    applyButtonSize();
    new MutationObserver(applyButtonSize).observe(shadowRoot, {childList:true,subtree:true});
    window.addEventListener("resize", applyButtonSize);
});
</script>
</body>
</html>
